plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinhvien.orderdrinkapp'
    // 34: CameraX 1.3 đòi biên dịch với SDK 34. targetSdk giữ 32 nên hành vi
    // lúc chạy của app không đổi.
    compileSdk 34

    defaultConfig {
        applicationId "com.sinhvien.orderdrinkapp"
        // 24 (Android 7.0): MediaPipe Tasks — dùng cho điểm mốc khuôn mặt và đo
        // chớp mắt của đăng nhập bằng khuôn mặt (QĐ-103) — không chạy dưới 24.
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Địa chỉ máy chủ (proxy web: /api/ và /socket.io/). Mặc định là hệ
        // thống thật trên máy host. Build bản trỏ vào sân thử không cần sửa mã:
        //     gradlew assembleDebug -PmayChu=http://10.0.2.2:8097/
        // (xem Resto_Server/docker-compose.santhu.yml).
        buildConfigField "String", "MAY_CHU",
                "\"" + (project.findProperty('mayChu') ?: 'http://10.0.2.2:8000/') + "\""
    }

    buildFeatures {
        buildConfig true
    }

    // Mô hình trong assets/khuon_mat phải để nguyên, không nén: MediaPipe mở tệp
    // .task bằng AssetManager.openFd(), cách này không đọc được tệp đã nén.
    androidResources {
        noCompress 'task', 'onnx'
    }

    // ONNX Runtime và MediaPipe mang mã máy (.so) cho từng loại CPU, mỗi loại
    // 20–40 MB. Hai biện pháp để file cài không phình ra (đo: một APK chung chứa
    // mọi loại CPU, .so không nén, nặng 95 MB):
    //  1. Tách APK theo loại CPU: điện thoại chỉ cài bản của mình. Android Studio
    //     tự build đúng bản cho máy đang cắm/máy ảo đang mở.
    //  2. Nén .so trong APK (useLegacyPackaging): nhẹ gần một nửa; đổi lại lúc cài
    //     Android giải nén ra bộ nhớ máy.
    // Có 'x86' mà KHÔNG có 'x86_64': MediaPipe 0.10.14 không phát hành bản
    // x86_64. Máy ảo x86_64 vẫn chạy được bản x86; trộn hai loại thì Android chỉ
    // chọn x86_64 và app sập vì thiếu thư viện MediaPipe.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86'
            universalApk false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Retrofit & GSON
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // Socket.io Client
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    // Android Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.4.0'

    // Đăng nhập bằng khuôn mặt (QĐ-103) — chạy hoàn toàn trên máy:
    //   CameraX: luồng khung hình camera trước
    //   MediaPipe Face Landmarker: 478 điểm mốc -> căn chỉnh mặt + đo chớp mắt
    //   ONNX Runtime: chạy MobileFaceNet của dự án xử lý ảnh (vector 512 chiều)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Hack fix for IDE sync bug
tasks.register("prepareKotlinBuildScriptModel") {}
